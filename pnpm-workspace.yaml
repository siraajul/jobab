packages:
  - apps/*
  - packages/*

# Next's declarations import React types but do not declare the peer. Bind them
# to the web app's React 19 types instead of the Expo app's hoisted React 18 types.
packageExtensions:
  'next@16':
    peerDependencies:
      '@types/react': ^19.3.0
    peerDependenciesMeta:
      '@types/react':
        optional: true

# React types are local to each app: React 19 for web and Expo-compatible React 18 for mobile.
overrides:
  'undici@^6': ^6.29.1
  'fast-uri@^3': ^3.1.9
  multer: ^2.5.0
  js-yaml: ^4.3.2
  lodash: ^4.18.1
  postcss: ^8.5.23
  'nanoid@^3': ^3.3.18
  qs: ^6.16.0
  form-data: ^4.0.6
  browserslist: ^4.28.7
  baseline-browser-mapping: ^2.11.0
  source-map-js: ^1.2.2
  proxy-addr: ^2.0.8
  'body-parser@^1': ^1.20.9
  'fast-copy@^3': ^3.1.0
  # Expo SDK 51 requires metro@0.80.x. Without these overrides, nativewind@4.2.4
  # pulls metro@0.84.4, pnpm hoists it, and Expo's CLI dies with
  # ERR_PACKAGE_PATH_NOT_EXPORTED on metro-cache/src/stores/FileStore.
  metro: 0.80.12
  metro-cache: 0.80.12
  metro-config: 0.80.12
  metro-core: 0.80.12
  metro-resolver: 0.80.12
  metro-runtime: 0.80.12
  metro-source-map: 0.80.12
  metro-transform-worker: 0.80.12

# Allow build scripts for trusted packages we depend on. Each entry is
# scrutinised when added — only add packages we actually trust to run code
# during install.
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  simple-git-hooks: true
  unrs-resolver: true

# msw ships a postinstall that nags about running `msw init public/`.
# We don't need the auto-init (jest runs in node, not the browser), so
# tell pnpm to ignore the build script silently instead of erroring.
ignoredBuiltDependencies:
  - msw

minimumReleaseAgeExclude:
  - '@pnpm/exe@10.34.9'
  - '@pnpm/linux-arm64@10.34.9'
  - '@pnpm/linux-x64@10.34.9'
  - '@pnpm/macos-arm64@10.34.9'
  - '@pnpm/macos-x64@10.34.9'
  - '@pnpm/win-arm64@10.34.9'
  - '@pnpm/win-x64@10.34.9'
