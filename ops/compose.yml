name: jobab-production
x-app: &app
  restart: unless-stopped
  env_file: ['${APP_ENV_FILE:-./production.env}']
  init: true
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs: [/tmp]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '3' }

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobab
      POSTGRES_DB: jobab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U jobab -d jobab']
      interval: 10s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes: [redisdata:/data]
    networks: [data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10
  migrate:
    image: jobab/migrate:${RELEASE:?Set RELEASE}
    build: { context: .., dockerfile: apps/backend/Dockerfile, target: migrate }
    env_file: ['${APP_ENV_FILE:-./production.env}']
    networks: [data]
    profiles: [tools]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    <<: *app
    image: jobab/backend:${RELEASE:?Set RELEASE}
    build: { context: .., dockerfile: apps/backend/Dockerfile, target: runtime }
    networks: [data, edge]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    <<: *app
    image: jobab/backend:${RELEASE:?Set RELEASE}
    command: [node, dist/agent/worker.js]
    networks: [data, edge]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "process.exit(Date.now()-require('fs').statSync('/tmp/jobab-worker-heartbeat').mtimeMs<60000?0:1)",
        ]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3
  web:
    <<: *app
    tmpfs: [/tmp, '/app/apps/web/.next/cache:uid=1000,gid=1000,mode=0755']
    image: jobab/web:${RELEASE:?Set RELEASE}
    build: { context: .., dockerfile: apps/web/Dockerfile }
    env_file: []
    networks: [edge]
    depends_on:
      api: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://api:3000
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddydata:/data, caddyconfig:/config]
    networks: [edge]
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }

networks:
  data: { internal: true }
  edge: {}
volumes:
  pgdata: {}
  redisdata: {}
  caddydata: {}
  caddyconfig: {}
